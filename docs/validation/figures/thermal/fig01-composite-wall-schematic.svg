<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Helvetica, Arial, sans-serif">
<rect width="720" height="330" fill="white"/>
<text x="360" y="24" text-anchor="middle" font-size="15" font-weight="bold">Composite plane wall (case 1)</text>
<rect x="250" y="90" width="140" height="150" fill="#f6e3d5" stroke="#333" stroke-width="1.6"/>
<rect x="390" y="90" width="70" height="150" fill="#fdf6dd" stroke="#333" stroke-width="1.6"/>
<text x="320" y="157" text-anchor="middle" font-size="12">layer A</text>
<text x="320" y="175" text-anchor="middle" font-size="12">k₁ = 1.2 W/mK</text>
<text x="320" y="193" text-anchor="middle" font-size="12">L₁ = 0.1 m</text>
<text x="425" y="157" text-anchor="middle" font-size="12">B</text>
<text x="425" y="175" text-anchor="middle" font-size="11">k₂ = 0.05</text>
<text x="425" y="193" text-anchor="middle" font-size="11">L₂ = 0.05 m</text>
<text x="160" y="139" text-anchor="middle" font-size="12">hot fluid</text>
<text x="160" y="157" text-anchor="middle" font-size="12">T∞₁ = 500 K</text>
<text x="160" y="175" text-anchor="middle" font-size="12">h₁ = 40 W/m²K</text>
<text x="552" y="139" text-anchor="middle" font-size="12">cold fluid</text>
<text x="552" y="157" text-anchor="middle" font-size="12">T∞₂ = 300 K</text>
<text x="552" y="175" text-anchor="middle" font-size="12">h₂ = 10 W/m²K</text>
<line x1="200" y1="209" x2="242" y2="209" stroke="#c0392b" stroke-width="2.2"/>
<polygon points="242,209 230,203 230,215" fill="#c0392b"/>
<line x1="468" y1="209" x2="510" y2="209" stroke="#c0392b" stroke-width="2.2"/>
<polygon points="510,209 498,203 498,215" fill="#c0392b"/>
<text x="355" y="270" text-anchor="middle" font-size="12">Q̇ = ΔT / ΣR,  ΣR = 1/h₁A + L₁/k₁A + L₂/k₂A + 1/h₂A</text>
<circle cx="250" cy="78" r="4" fill="#1f5fa8"/>
<circle cx="390" cy="78" r="4" fill="#1f5fa8"/>
<circle cx="460" cy="78" r="4" fill="#1f5fa8"/>
<text x="250" y="70" text-anchor="middle" font-size="11">s1</text>
<text x="390" y="70" text-anchor="middle" font-size="11">s2</text>
<text x="460" y="70" text-anchor="middle" font-size="11">s3</text>
<text x="360" y="316" text-anchor="middle" font-size="12">Figure 1. Composite wall: three solid nodes (surfaces and interface), two conduction and two convection conductors.</text>
</svg>