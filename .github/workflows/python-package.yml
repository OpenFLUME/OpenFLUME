name: Python package

# Reusable: builds the `openflume` wheel + sdist once, then installs the
# built wheel (never the source tree) on every OS and the oldest/newest
# supported Python and runs python/tests against it. Called by ci.yml on
# every PR/push and by python-publish.yml before anything is uploaded.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build:python
      - uses: astral-sh/setup-uv@v10
      - name: Lint
        working-directory: python
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Build wheel and sdist
        run: uv build python --out-dir python/dist
      - name: Wheel must build from the sdist alone (no Node, no repo)
        run: |
          mkdir -p /tmp/sdist && tar xzf python/dist/*.tar.gz -C /tmp/sdist
          uv build --wheel /tmp/sdist/openflume-* --out-dir /tmp/sdist/out
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: python/dist/
          retention-days: 7

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
        extras: ["test,numpy,pandas"]
        include:
          # Plain-Python fallbacks (no numpy/pandas installed).
          - os: ubuntu-latest
            python: "3.13"
            extras: "test"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            python/tests
            python/pyproject.toml
            package.json
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: python/dist/
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the built wheel
        run: python -m pip install "$(ls python/dist/*.whl)[${{ matrix.extras }}]"
      - run: openflume info
      - run: python -m pytest python/tests -p no:cacheprovider
