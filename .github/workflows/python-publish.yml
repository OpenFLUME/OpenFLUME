name: Publish Python package

# Publishes `openflume` to PyPI with trusted publishing (OIDC, no API token)
# when a release tag vX.Y.Z is pushed. The tag must equal both
# package.json "version" and python/pyproject.toml "version".
#
# Manual runs (workflow_dispatch) publish to TestPyPI instead, to rehearse a
# release. One-time setup — see docs/python.md "Releasing":
#   * PyPI / TestPyPI: add a trusted publisher for repository
#     OpenFLUME/OpenFLUME, workflow python-publish.yml, environment
#     `pypi` / `testpypi`.
#   * GitHub: create environments `pypi` and `testpypi` (optionally with
#     required reviewers).

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tag, package.json and pyproject.toml versions agree
        run: |
          npm_version=$(node -p "require('./package.json').version")
          py_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml)
          echo "package.json=$npm_version pyproject.toml=$py_version ref=$GITHUB_REF_NAME"
          test "$npm_version" = "$py_version"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$py_version"
          fi

  package:
    needs: check-version
    uses: ./.github/workflows/python-package.yml

  publish-pypi:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/openflume/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/openflume/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal may re-run for the same version.
          skip-existing: true
