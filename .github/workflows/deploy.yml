name: Deploy demo

# Deploys only after CI has passed on main. A red main must never reach the
# published demo; `workflow_dispatch` remains for a deliberate manual push.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Daily rebuild of main so blog posts dated today go live on schedule
  # (see site/.vitepress/blog.ts). main has already passed CI.
  schedule:
    - cron: "7 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /OpenFLUME/
      # Documentation site (VitePress, sources in docs/) → dist/docs, served
      # at /OpenFLUME/docs/ beside the app. Must run after the app build,
      # which empties dist/.
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
